services:
  postgres:
    image: postgres:16-alpine
    environment:
      POSTGRES_USER: glagolitsa
      POSTGRES_PASSWORD: glagolitsa
      POSTGRES_DB: glagolitsa
    ports:
      - "5432:5432"
    volumes:
      - glagolitsa_pg:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U glagolitsa -d glagolitsa"]
      interval: 3s
      timeout: 3s
      retries: 10

  redis:
    image: redis:7-alpine
    ports:
      - "6379:6379"
    command: ["redis-server", "--save", "", "--appendonly", "no"]
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 3s
      timeout: 3s
      retries: 10

  minio:
    image: minio/minio:latest
    command: server /data --console-address ":9001"
    environment:
      MINIO_ROOT_USER: ${MINIO_ROOT_USER:-glagolitsa}
      MINIO_ROOT_PASSWORD: ${MINIO_ROOT_PASSWORD:-glagolitsa-secret}
    ports:
      - "9000:9000"
      - "9001:9001"
    volumes:
      - glagolitsa_minio:/data
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:9000/minio/health/live"]
      interval: 5s
      timeout: 5s
      retries: 10

  minio-init:
    image: minio/mc:latest
    depends_on:
      minio:
        condition: service_healthy
    environment:
      MINIO_ROOT_USER: ${MINIO_ROOT_USER:-glagolitsa}
      MINIO_ROOT_PASSWORD: ${MINIO_ROOT_PASSWORD:-glagolitsa-secret}
    entrypoint: >
      /bin/sh -c "
      mc alias set local http://minio:9000 "$$MINIO_ROOT_USER" "$$MINIO_ROOT_PASSWORD" &&
      mc mb --ignore-existing local/glagolitsa-attachments &&
      mc anonymous set none local/glagolitsa-attachments &&
      exit 0
      "

volumes:
  glagolitsa_pg:
  glagolitsa_minio:
