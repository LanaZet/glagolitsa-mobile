# Получатель логинится и остаётся в сессии (без logout).
appId: com.glagolitsa.mobile
---
- launchApp:
    clearState: true
- extendedWaitUntil:
    visible: "Glagolitsa"
    timeout: 30000
- tapOn:
    text: "Войти как ${RECIPIENT_USERNAME}"
    optional: true
- runFlow:
    when:
      notVisible: "Чаты"
    commands:
      - tapOn: "Логин"
      - inputText: ${RECIPIENT_USERNAME}
      - tapOn: "Пароль"
      - inputText: ${RECIPIENT_PASSWORD}
      - hideKeyboard
      - tapOn: "Войти"
- extendedWaitUntil:
    visible: "Чаты"
    timeout: 90000