org.gradle.jvmargs=-Xmx2048M -Dfile.encoding=UTF-8
org.gradle.caching=true
org.gradle.parallel=true
org.gradle.vfs.watch=true

kotlin.code.style=official
kotlin.daemon.jvmargs=-Xmx2048M
kotlin.incremental=true
kotlin.incremental.multiplatform=true

android.useAndroidX=true
android.nonTransitiveRClass=true

# API URL is not committed. For your own build, set apiBaseUrl in
# local.properties (gitignored) or pass -PapiBaseUrl=https://your.api
# Empty means a debug client uses the local Go server.

# Single source of truth for androidApp + shared BuildConfig update identity.
# Keep both in sync; otherwise soft-update may prompt installing an older APK.
appVersionName=0.1.13
appVersionCode=15

# KMP: we wire iosMain dependsOn manually for shared ios targets
kotlin.mpp.applyDefaultHierarchyTemplate=false
